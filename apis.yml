name: Prismlab
description: Prismlab (Shanghai Prismlab Technology / 上海普利生) is an industrial-grade 3D
  printing equipment provider founded in Shanghai, China, and a portfolio company of
  Qiming Venture Partners. The company develops high-precision additive manufacturing
  systems built on its proprietary SMS (Scan-Mode Slicing / sub-pixel micro-scanning)
  photocuring technology, including the Rapid 600 and Rapid 400 industrial printer
  series, the SP high-accuracy series, and MP micro-nano printers for research. Its
  systems serve dental and orthodontics (clear aligners, dentures), precision medical
  devices, jewelry, education and research, electronics, and mold/prototype manufacturing.
  As a B2B hardware manufacturer, Prismlab publishes no public developer API, SDK,
  or developer portal; this profile captures identity and a live domain-security probe.
